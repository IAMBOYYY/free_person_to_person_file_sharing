<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Optical Transfer — Receive</title>
  <link rel="stylesheet" href="../shared/style.css" />
</head>
<body>
  <h1>OPTICAL TRANSFER</h1>

  <div id="step-start" class="card" style="width: min(92vw, 480px)">
    <p>Point your camera at the sender's QR code to receive files.</p>
    <button id="start-btn" style="width:100%">Start Camera</button>
    <p class="hint" style="margin-top:8px">Camera permission is required. No data leaves your device.</p>
  </div>

  <div id="step-receive" style="display:none; width:100%; align-items:center; flex-direction:column; gap:16px">
    <div class="preview"><video id="video" muted playsinline></video></div>
    <div class="metrics" id="metrics">
      <div class="metric"><div class="k">capture fps</div><div class="v" id="m-cap">—</div></div>
      <div class="metric"><div class="k">decode fps</div><div class="v accent" id="m-dec">—</div></div>
      <div class="metric"><div class="k">goodput</div><div class="v accent" id="m-rate">—</div></div>
      <div class="metric"><div class="k">elapsed</div><div class="v" id="m-time">—</div></div>
      <div class="metric"><div class="k">frames new/dup</div><div class="v" id="m-frames">—</div></div>
      <div class="metric"><div class="k">blocks K</div><div class="v" id="m-k">—</div></div>
    </div>
    <div class="progress-track" id="progress" style="display:none"></div>
    <p class="hint" id="progress-label" style="display:none; text-align:center">Waiting for frames…</p>
    <div id="result"></div>
    <button id="stop-btn" class="danger" style="display:none">Stop</button>
  </div>

  <!-- Private code prompt overlay (hidden until needed) -->
  <div id="code-overlay" class="overlay" style="display:none">
    <div class="panel">
      <p style="margin-bottom:12px">🔒 This is a private transfer</p>
      <label style="display:block; margin-bottom:8px; color:var(--muted)">Enter the code</label>
      <input type="password" id="private-code" style="width:100%; margin-bottom:12px" placeholder="e.g. p4ssw0rd" />
      <button id="submit-code">Continue</button>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
