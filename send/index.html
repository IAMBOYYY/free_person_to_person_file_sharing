<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Optical Transfer — Send</title>
  <link rel="stylesheet" href="../shared/style.css" />
</head>
<body>
  <h1>OPTICAL TRANSFER</h1>

  <!-- Step 1: File selection -->
  <div id="step-files" class="card" style="width: min(92vw, 560px)">
    <p style="margin-bottom: 12px">Select files to send</p>
    <div id="dropzone" class="file-drop" style="
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 30px; text-align: center; cursor: pointer; margin-bottom: 12px;
    ">
      <p>Drop files here or click to browse</p>
      <input type="file" id="file-input" multiple style="display:none" />
    </div>
    <ul id="file-list" class="file-list"></ul>
    <p id="total-size" style="color:var(--muted); font-size:0.9rem; margin:8px 0"></p>
  </div>

  <!-- Step 2: Mode & code -->
  <div id="step-mode" class="card" style="width: min(92vw, 560px); display:none;">
    <p style="margin-bottom: 12px">Transfer mode</p>
    <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px">
      <button id="mode-public" class="selected" style="flex:1">Public</button>
      <button id="mode-private" style="flex:1">Private</button>
    </div>
    <div id="code-box" style="display:none">
      <label style="display:block; margin-bottom:4px; color:var(--muted)">Access code (min 4 chars)</label>
      <input type="text" id="access-code" placeholder="e.g. p4ssw0rd" style="width:100%" />
      <p style="font-size:0.8rem; color:var(--muted); margin-top:6px">
        Share this code with the receiver before they scan.
      </p>
    </div>
  </div>

  <!-- Step 3: Transmitting -->
  <div id="step-transmit" style="display:none; width:100%; align-items:center; flex-direction:column; gap:16px">
    <div class="badge" id="mode-badge">Public</div>
    <div class="qr-stage"><canvas id="qr" width="16" height="16"></canvas></div>
    <div class="metrics" id="metrics">
      <div class="metric"><div class="k">TX fps</div><div class="v accent" id="m-fps">—</div></div>
      <div class="metric"><div class="k">payload</div><div class="v" id="m-payload">—</div></div>
      <div class="metric"><div class="k">blocks</div><div class="v" id="m-k">—</div></div>
    </div>
    <p id="status-hint" class="hint"></p>
    <button id="cancel-send" class="danger">Cancel</button>

    <!-- Advanced settings (collapsed) -->
    <details class="advanced">
      <summary>Advanced</summary>
      <div class="row">
        <label>bytes / frame <select id="cfg-bytes"></select></label>
        <label>tx fps <select id="cfg-fps"></select></label>
        <label>error correction <select id="cfg-ecc"></select></label>
        <label>display size <input type="range" id="cfg-size" min="300" max="1200" step="50" value="800"></label>
      </div>
    </details>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
